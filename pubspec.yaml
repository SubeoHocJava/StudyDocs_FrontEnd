name: studydocs
description: "This is an application that allows users to post as well as a library for learning materials."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  syncfusion_flutter_pdfviewer: ^31.2.16
  open_filex: ^4.5.0
  path_provider: ^2.1.4
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  flutter_slidable: ^4.0.3
  flutter_local_notifications: ^19.5.0

  equatable: ^2.0.5 #state
  flutter_bloc: ^8.1.3 #bloc
  provider: ^6.1.2
  google_fonts: ^6.2.1
  dotted_border: ^2.1.0
  dio: ^5.4.0 #call api
  #note: xem xet https (bo qua)

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
      - assets/icons/
