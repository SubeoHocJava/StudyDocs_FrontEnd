name: studydocs
description: "This is an application that allows users to post as well as a library for learning materials."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  syncfusion_flutter_pdfviewer: ^31.2.16
  open_filex: ^4.5.0
  path_provider: ^2.1.4
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^19.5.0

  go_router: ^14.6.2
  equatable: ^2.0.5
  flutter_bloc: ^8.1.3
  provider: ^6.1.2
  google_fonts: ^6.2.1
  dotted_border: ^2.1.0
  file_picker: ^8.0.0
  speech_to_text: ^7.0.0
  cached_network_image: ^3.3.0

  dio: ^5.9.0
  google_sign_in: ^6.2.1
  font_awesome_flutter: ^11.0.0
  shared_preferences: ^2.2.2
  syncfusion_flutter_charts: ^31.2.18
  intl: ^0.19.0
  flutter_dotenv: ^5.2.1
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.2

  cupertino_icons: ^1.0.8
  flutter_widget_from_html: ^0.17.1
  url_launcher: ^6.3.2
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  flutter_slidable: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - .env